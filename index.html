<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Allocation</title>
<style>
:root {
  --line: #d8dade;
  --head: #f6f7f8;
  --ink: #1d1d1f;
  --muted: #86868b;
  --weekend: #eceef0;
  --today: #fff8dc;
  --unalloc: #efedfb;
  --link: #0071e3;
  --paper: #ffffff;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
header {
  padding: 16px 20px 6px;
}
h1 {
  font-size: 19px;
  font-weight: 600;
  margin: 0 0 2px;
  letter-spacing: -0.01em;
}
.sub {
  color: var(--muted);
  font-size: 12px;
}
nav {
  padding: 0 20px 12px;
  display: flex;
  gap: 4px;
}
nav button {
  background: none;
  border: 0;
  color: var(--link);
  cursor: pointer;
  font: inherit;
  padding: 5px 8px;
  border-radius: 6px;
}
nav button:hover {
  background: #f0f0f2;
}
nav button:disabled {
  color: var(--muted);
  cursor: default;
  background: none;
}
.scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
table {
  border-collapse: separate;
  border-spacing: 0;
  min-width: 100%;
}
th,
td {
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
td {
  vertical-align: top;
  padding: 6px;
}
thead th {
  background: var(--head);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .04em;
  text-align: left;
  white-space: nowrap;
  padding: 8px 6px;
  position: sticky;
  top: 0;
  z-index: 3;
  border-top: 1px solid var(--line);
}
.who {
  min-width: 168px;
  max-width: 168px;
  padding: 8px 10px;
  text-align: left;
  position: sticky;
  left: 0;
  background: var(--paper);
  z-index: 2;
  font-weight: 600;
  border-left: 1px solid var(--line);
}
thead .who {
  z-index: 4;
  background: var(--head);
}
.day {
  min-width: 152px;
}
.weekend {
  background: var(--weekend);
}
.today {
  background: var(--today);
}
tbody tr:first-child .who,
tbody tr:first-child td {
  background: var(--unalloc);
}
.count {
  color: var(--muted);
  font-weight: 400;
}
.empty {
  color: var(--muted);
  text-align: center;
}
.card {
  border: 1px solid;
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 5px;
  background: var(--paper);
}
.card:last-child {
  margin-bottom: 0;
}
.card b {
  display: block;
  font-size: 11px;
  padding: 3px 6px;
  font-weight: 600;
}
.card .body {
  padding: 5px 6px;
}
.card .time {
  font-variant-numeric: tabular-nums;
}
.card .where {
  color: #1d4ed8;
  margin-top: 1px;
}
.big {
  font-size: 15px;
  font-weight: 600;
  text-align: center;
  padding-top: 10px;
}
.msg {
  padding: 48px 20px;
  text-align: center;
  color: var(--muted);
}
.card {
  cursor: grab;
}
.card.picked {
  outline: 2px solid var(--link);
  outline-offset: 1px;
}
.card.dragging {
  opacity: .4;
}
td.target {
  background: #e8f2ff !important;
  outline: 2px dashed var(--link);
  outline-offset: -3px;
}
.big {
  cursor: pointer;
  color: var(--link);
}
.note {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 18px;
  background: #1d1d1f;
  color: #fff;
  padding: 9px 14px;
  border-radius: 8px;
  font-size: 13px;
  max-width: 90vw;
  z-index: 20;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
}
.hint {
  color: var(--muted);
  font-size: 12px;
  padding: 0 20px 10px;
}
.veil {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .35);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 30;
  padding: 16px;
}
.sheet {
  background: var(--paper);
  border-radius: 12px;
  width: 420px;
  max-width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  padding: 18px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
}
.sheet h2 {
  font-size: 16px;
  margin: 0 0 2px;
  font-weight: 600;
}
.sheet .when {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 14px;
}
.sheet label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin: 10px 0 3px;
}
.sheet input,
.sheet select {
  width: 100%;
  font: inherit;
  padding: 8px 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--paper);
  color: var(--ink);
}
.results {
  border: 1px solid var(--line);
  border-radius: 7px;
  margin-top: 6px;
  max-height: 190px;
  overflow-y: auto;
}
.results div {
  padding: 7px 9px;
  cursor: pointer;
  border-bottom: 1px solid var(--line);
}
.results div:last-child {
  border-bottom: 0;
}
.results div:hover,
.results div.on {
  background: #f0f6ff;
}
.results .sub2 {
  color: var(--muted);
  font-size: 11px;
  padding: 0;
  border: 0;
}
.actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 16px;
}
.actions button {
  font: inherit;
  padding: 8px 14px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  cursor: pointer;
}
.actions button.primary {
  background: var(--link);
  border-color: var(--link);
  color: #fff;
}
.actions button:disabled {
  opacity: .5;
  cursor: default;
}
.problem {
  color: #a3554e;
  font-size: 12px;
  margin-top: 10px;
}
.linkish {
  background: none;
  border: 0;
  color: var(--link);
  font: inherit;
  cursor: pointer;
  padding: 4px 0;
}
.card b {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
}
.more {
  cursor: pointer;
  padding: 0 2px;
  opacity: .65;
  font-weight: 700;
  letter-spacing: 1px;
}
.more:hover {
  opacity: 1;
}
.crewrow {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
}
.crewrow:last-child {
  border-bottom: 0;
}
.crewrow .nm {
  flex: 1;
}
.crewrow button {
  font: inherit;
  font-size: 12px;
  background: none;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 3px 8px;
  cursor: pointer;
  color: var(--ink);
}
.crewrow button.x {
  color: #a3554e;
  border-color: #e3c9c5;
}
.nobody {
  color: var(--muted);
  padding: 8px 0;
}
.addbtn {
  margin-left: auto;
  font-weight: 600;
}
.inlineact {
  display: flex;
  gap: 12px;
  align-items: center;
}
</style>

<header>
  <h1 id="title">Allocation</h1>
  <div class="sub">Times are Melbourne time.</div>
</header>
<nav>
  <button id="prev">‹ Previous</button>
  <button id="now">Current</button>
  <button id="next">Next ›</button>
  <button id="add" class="addbtn">+ Add job</button>
</nav>
<div class="hint"
  id="hint">Drag a job sideways to change the day, or up and down to change who is on it. On a phone, tap a job then tap where it should go. Tap an empty square to add one, or ⋯ on a job to change its crew.</div>
<div class="scroll">
  <div id="out" class="msg">Loading…</div>
</div>

<script>
// The API. The token never reaches THIS host: it arrives in the fragment, which
// browsers do not send to the server, so GitHub never sees it. It is passed on
// only to Supabase.
const API = "https://rkdfjhpjwaoqgsgadwem.supabase.co/functions/v1/allocation";

// One colour per work type, echoing BaseApp's palette so the office reads the
// board the way it always has.
const COLOURS = {
  undergrounds: "#4f7a5a",
  maintenance: "#9c5470",
  hook_ups: "#6f5a9c",
  rectification: "#a3554e",
  jackhammer: "#7d6347",
  cctv: "#3f6a9c",
  cctv_pre_slab: "#3f6a9c",
  cctv_post_slab: "#3f6a9c",
  site_inspection: "#5a7a7a",
  checkmeasure: "#7a6a4f",
  jetter: "#4f6a7a",
  vba_inspection: "#6a4f7a",
  water_meter_setup: "#4f7a7a",
  supplier_delivery: "#7a5a4f",
  haulage: "#5a5a5a",
  other: "#6b7280",
};

const auth = new URLSearchParams(location.hash.slice(1));
let offset = 0;
let loading = false;

const esc = (s) =>
  String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let grid = null; // the last grid the API gave us
let picked = null; // {bookingId, resourceId, day} — tap-then-tap

function cardHtml(c, cell) {
  const colour = COLOURS[c.workType] || COLOURS.other;
  const lot = c.lot ? "/" + esc(c.lot) : "";
  // An all-day booking says so. It promised nobody a time, and printing an
  // invented 7:00 AM would put a made-up arrival window in front of a builder.
  const time = c.startLabel ? esc(c.startLabel) : "All day";
  const sel = picked && picked.bookingId === c.bookingId &&
      picked.resourceId === cell.resourceId && picked.day === cell.day
    ? " picked"
    : "";
  return '<div class="card' + sel + '" draggable="true"' +
    ' data-booking="' + esc(c.bookingId) + '"' +
    ' style="border-color:' + colour + '">' +
    '<b style="background:' + colour + "1f;color:" + colour + '">' +
    "<span>" + (c.isLead ? "\u{1F451} " : "") + esc(c.label) + "</span>" +
    '<span class="more" data-more="' + esc(c.bookingId) + '" title="Crew">\u22ef</span>' +
    "</b>" +
    '<div class="body"><div class="time">' + time + "</div>" +
    '<div class="where">' + esc(c.client) + lot + " " + esc(c.address) + "</div>" +
    "</div></div>";
}

function cellHtml(cards, resourceId, day, extraClass) {
  const attrs = ' data-day="' + day + '"' +
    (resourceId === null ? ' data-unallocated="1"' : ' data-resource="' + esc(resourceId) + '"');
  const cls = extraClass + (cards.length ? "" : " empty");
  const inner = cards.length ? cards.map((c) => cardHtml(c, { resourceId, day })).join("") : "\u2014";
  return '<td class="' + cls.trim() + '"' + attrs + ">" + inner + "</td>";
}

function render(g) {
  grid = g;
  const first = g.days[0], last = g.days[g.days.length - 1];
  document.getElementById("title").textContent = "Allocation: " + first.label + " \u2013 " + last.label;

  const head = '<tr><th class="who">CONTRACTOR</th>' +
    g.days.map((d) =>
      '<th class="day ' + (d.isWeekend ? "weekend " : "") + (d.isToday ? "today" : "") + '">' +
      esc(d.label) + "</th>"
    ).join("") + "</tr>";

  const total = g.days.reduce((n, d) => n + (g.unallocated[d.iso] || []).length, 0);
  const unallocRow = '<tr><th class="who">Unallocated <span class="count">(' +
    total + ")</span></th>" +
    g.days.map((d) => {
      const cards = g.unallocated[d.iso] || [];
      const base = (d.isWeekend ? "weekend " : "") + (d.isToday ? "today " : "");
      // The cards, ALWAYS — never a bare count you have to know to tap. This row
      // is the to-do list of work nobody is on yet, and hiding it behind a
      // gesture nobody discovers is the same as not having it at all.
      return cellHtml(cards, null, d.iso, base);
    }).join("") + "</tr>";

  const rows = g.rows.map((r) =>
    '<tr><th class="who">' + esc(r.name) + ' <span class="count">(' + r.count + ")</span></th>" +
    g.days.map((d) =>
      cellHtml(
        r.cells[d.iso] || [],
        r.resourceId,
        d.iso,
        (d.isWeekend ? "weekend " : "") + (d.isToday ? "today " : ""),
      )
    ).join("") +
    "</tr>"
  ).join("");

  const out = document.getElementById("out");
  out.className = "";
  out.innerHTML = "<table><thead>" + head + "</thead><tbody>" +
    unallocRow + rows + "</tbody></table>";
}

let noteTimer = null;
function note(text) {
  const old = document.querySelector(".note");
  if (old) old.remove();
  if (!text) return;
  const el = document.createElement("div");
  el.className = "note";
  el.textContent = text;
  document.body.appendChild(el);
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => el.remove(), 5000);
}

function cellOf(td) {
  if (!td) return null;
  return {
    resourceId: td.dataset.unallocated ? null : (td.dataset.resource || null),
    day: td.dataset.day,
  };
}

function setBusy(busy) {
  loading = busy;
  for (const id of ["prev", "now", "next"]) document.getElementById(id).disabled = busy;
}

function authQuery(extra) {
  return new URLSearchParams(Object.assign({
    u: auth.get("u") || "",
    e: auth.get("e") || "",
    s: auth.get("s") || "",
    p: String(offset),
  }, extra || {}));
}

async function load() {
  if (loading) return;
  setBusy(true);
  const out = document.getElementById("out");
  out.className = "msg";
  out.textContent = "Loading\u2026";
  try {
    const res = await fetch(API + "?" + authQuery());
    const body = await res.json();
    if (!res.ok) {
      out.textContent = body.error || "That did not work.";
      return;
    }
    render(body);
  } catch (_) {
    out.textContent = "Could not reach the schedule. Check your signal and try again.";
  } finally {
    setBusy(false);
  }
}

async function move(bookingId, from, to) {
  if (loading) return;
  setBusy(true);
  try {
    const res = await fetch(API + "?" + authQuery(), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ bookingId, from, to }),
    });
    const body = await res.json();
    if (!res.ok) {
      note(body.error || "That did not work.");
      return;
    }
    // The grid always rides back with the write, so the board cannot drift from
    // the table it is drawing.
    if (body.grid) render(body.grid);
    note(body.problem);
  } catch (_) {
    note("Could not save that move. Check your signal.");
  } finally {
    setBusy(false);
  }
}

// ── the crew on a booking ─────────────────────────────────────────────────
//
// A booking sits on EVERY allocated person's row, so this is reachable from any
// copy of the card and always shows the WHOLE crew, not just the row you tapped.

let crewSheet = null; // bookingId

function findCard(bookingId) {
  for (const day of Object.keys(grid.unallocated)) {
    const hit = (grid.unallocated[day] || []).find((c) => c.bookingId === bookingId);
    if (hit) return hit;
  }
  for (const r of grid.rows) {
    for (const day of Object.keys(r.cells)) {
      const hit = r.cells[day].find((c) => c.bookingId === bookingId);
      if (hit) return hit;
    }
  }
  return null;
}

function openCrewSheet(bookingId) {
  const c = findCard(bookingId);
  if (!c) {
    note("That booking is gone — reload the board.");
    return;
  }
  crewSheet = bookingId;

  const onJob = new Set(c.crew.map((m) => m.resourceId));
  const spare = grid.rows.filter((r) => !onJob.has(r.resourceId));
  const lot = c.lot ? "/" + esc(c.lot) : "";

  const crewHtml = c.crew.length
    ? c.crew.map((m) =>
      '<div class="crewrow"><span class="nm">' + (m.isLead ? "\u{1F451} " : "") + esc(m.name) +
      "</span>" +
      (m.isLead ? "" : '<button data-lead="' + esc(m.resourceId) + '">Make lead</button>') +
      '<button class="x" data-off="' + esc(m.resourceId) + '" title="Take them off">\u00d7</button>' +
      "</div>"
    ).join("")
    : '<div class="nobody">Nobody on this yet.</div>';

  const veil = document.createElement("div");
  veil.className = "veil";
  veil.innerHTML = '<div class="sheet">' +
    "<h2>" + esc(c.label) + "</h2>" +
    '<div class="when">' + esc(c.client) + lot + " " + esc(c.address) +
    " \u00b7 " + (c.startLabel ? esc(c.startLabel) : "All day") + "</div>" +
    "<label>Crew</label>" + crewHtml +
    '<label for="addcrew">Put somebody else on</label>' +
    '<select id="addcrew"><option value="">Choose\u2026</option>' +
    spare.map((r) => '<option value="' + esc(r.resourceId) + '">' + esc(r.name) + "</option>").join("") +
    "</select>" +
    '<div class="problem" id="prob"></div>' +
    '<div class="actions"><button id="cancel">Done</button></div>' +
    "</div>";
  document.body.appendChild(veil);

  veil.addEventListener("click", (ev) => {
    if (ev.target === veil) closeCrewSheet();
  });
  document.getElementById("cancel").onclick = closeCrewSheet;
  document.getElementById("addcrew").onchange = (ev) => {
    if (ev.target.value) crewAction("add", ev.target.value);
  };
  for (const b of veil.querySelectorAll("button[data-off]")) {
    b.onclick = () => crewAction("remove", b.dataset.off);
  }
  for (const b of veil.querySelectorAll("button[data-lead]")) {
    b.onclick = () => crewAction("lead", b.dataset.lead);
  }
}

function closeCrewSheet() {
  crewSheet = null;
  const v = document.querySelector(".veil");
  if (v) v.remove();
}

async function crewAction(what, resourceId) {
  const bookingId = crewSheet;
  const prob = document.getElementById("prob");
  if (prob) prob.textContent = "";
  try {
    const res = await post({ action: "crew", bookingId, what, resourceId });
    if (res.body.problem) {
      if (prob) prob.textContent = res.body.problem;
      return;
    }
    if (res.body.grid) {
      render(res.body.grid);
      // Reopened from the FRESH grid, so the list is what the table now holds
      // rather than what it held when the sheet opened.
      closeCrewSheet();
      openCrewSheet(bookingId);
    }
  } catch (_) {
    if (prob) prob.textContent = "Could not save that. Check your signal.";
  }
}

// ── adding a site and a visit ─────────────────────────────────────────────
//
// A JOB IS A SITE, A BOOKING IS A VISIT to it. One address gets undergrounds
// now and hook-ups months later, so the work type is asked here, on the visit,
// and never on the site.

let sheet = null; // {cell, jobId, siteLabel, newSite}
let findTimer = null;

function closeSheet() {
  sheet = null;
  const v = document.querySelector(".veil");
  if (v) v.remove();
}

function openSheet(cell) {
  // cell === null means the button at the top rather than a tap on a square:
  // there is no day and nobody implied, so both become fields.
  const free = cell === null;
  const day = free ? "" : (grid.days.find((d) => d.iso === cell.day) || {}).label || cell.day;
  const who = free ? "" : cell.resourceId === null
    ? "Unallocated"
    : (grid.rows.find((r) => r.resourceId === cell.resourceId) || {}).name || "";
  sheet = {
    cell,
    free,
    jobId: null,
    siteLabel: "",
    newSite: free,
    clientId: null,
    clientName: "",
    supervisorId: null,
    supervisors: [],
    address: "",
    lot: "",
    builderQuery: "",
  };

  const first = grid.days[0].iso, last = grid.days[grid.days.length - 1].iso;
  const today = (grid.days.find((d) => d.isToday) || {}).iso;
  const whenBlock = free
    ? '<label for="dy">Day</label>' +
      '<input id="dy" type="date" value="' + (today || first) + '" min="' + first + '" max="' + last + '">' +
      '<label for="who">Who is on it</label>' +
      '<select id="who"><option value="">Unallocated for now</option>' +
      grid.rows.map((r) => '<option value="' + esc(r.resourceId) + '">' + esc(r.name) + "</option>").join("") +
      "</select>"
    : "";

  const veil = document.createElement("div");
  veil.className = "veil";
  veil.innerHTML = '<div class="sheet">' +
    "<h2>" + (free ? "New job" : "Add a job") + "</h2>" +
    (free
      ? '<div class="when">Anywhere in these three weeks</div>'
      : '<div class="when">' + esc(day) + " \u00b7 " + esc(who) + "</div>") +
    '<div id="siteBlock"></div>' +
    '<label for="wt">Work</label>' +
    '<select id="wt">' +
    (grid.workTypes || []).map((w) => '<option value="' + esc(w.value) + '">' + esc(w.label) + "</option>")
      .join("") +
    "</select>" +
    '<label for="tm">Start time \u2014 leave blank for all day</label>' +
    '<input id="tm" placeholder="07:00" inputmode="numeric">' +
    whenBlock +
    '<div class="problem" id="prob"></div>' +
    '<div class="actions">' +
    '<button id="cancel">Cancel</button>' +
    '<button id="save" class="primary">Add it</button>' +
    "</div>" +
    "</div>";
  document.body.appendChild(veil);

  veil.addEventListener("click", (ev) => {
    if (ev.target === veil) closeSheet();
  });
  document.getElementById("cancel").onclick = closeSheet;
  document.getElementById("save").onclick = saveSheet;
  renderSiteBlock();
}


/** Keep what has been typed across a re-render — the block is rebuilt whenever a
 *  builder is picked, and losing a half-typed address to that is maddening. */
function stashSite() {
  const g = (id) => (document.getElementById(id) || {}).value;
  if (g("ad") !== undefined) sheet.address = g("ad");
  if (g("lt") !== undefined) sheet.lot = g("lt");
  if (g("bq") !== undefined) sheet.builderQuery = g("bq");
}

function supervisorBlock() {
  // Inline, not prompt(): a browser dialog sits outside the sheet's own look and
  // some mobile browsers suppress it outright, which fails silently.
  if (sheet.addingSupervisor) {
    return '<label for="svnew">New site supervisor</label>' +
      '<input id="svnew" placeholder="Joe De Cata" autocomplete="off" value="' +
      esc(sheet.newSupervisorName || "") + '">' +
      '<div class="inlineact">' +
      '<button class="linkish" id="svsave">Add them</button>' +
      '<button class="linkish" id="svcancel">Cancel</button>' +
      "</div>";
  }
  const list = sheet.supervisors || [];
  return '<label for="sv">Site supervisor</label>' +
    '<select id="sv"><option value="">Not known yet</option>' +
    list.map((v) =>
      '<option value="' + esc(v.id) + '"' + (sheet.supervisorId === v.id ? " selected" : "") + ">" +
      esc(v.name) + "</option>"
    ).join("") +
    '<option value="__new">Add a new one\u2026</option>' +
    "</select>";
}

function wireSiteFields() {
  const changeBuilder = document.getElementById("changeBuilder");
  if (changeBuilder) {
    changeBuilder.onclick = () => {
      stashSite();
      sheet.clientId = null;
      sheet.clientName = "";
      sheet.supervisorId = null;
      sheet.supervisors = [];
      sheet.addingSupervisor = false;
      sheet.newSupervisorName = "";
      renderSiteBlock();
    };
  }

  const bq = document.getElementById("bq");
  if (bq) {
    bq.oninput = (ev) => {
      clearTimeout(findTimer);
      sheet.builderQuery = ev.target.value;
      findTimer = setTimeout(() => searchBuilders(ev.target.value), 220);
    };
    const nb = document.getElementById("newBuilder");
    if (nb) nb.onclick = () => addBuilder(bq.value);
  }

  const sv = document.getElementById("sv");
  if (sv) {
    sv.onchange = () => {
      if (sv.value === "__new") {
        sv.value = sheet.supervisorId || "";
        sheet.addingSupervisor = true;
        sheet.newSupervisorName = "";
        renderSiteBlock();
        const box = document.getElementById("svnew");
        if (box) box.focus();
        return;
      }
      sheet.supervisorId = sv.value || null;
    };
  }

  const svnew = document.getElementById("svnew");
  if (svnew) {
    svnew.oninput = () => {
      sheet.newSupervisorName = svnew.value;
    };
    svnew.onkeydown = (ev) => {
      if (ev.key !== "Enter") return;
      // Enter here would otherwise submit the whole job with a half-typed name.
      ev.preventDefault();
      addSupervisor(svnew.value);
    };
    document.getElementById("svsave").onclick = () => addSupervisor(svnew.value);
    document.getElementById("svcancel").onclick = () => {
      sheet.addingSupervisor = false;
      sheet.newSupervisorName = "";
      renderSiteBlock();
    };
  }
}

async function searchBuilders(q) {
  const hits = document.getElementById("bhits");
  if (!hits) return;
  if (q.trim().length < 2) {
    hits.hidden = true;
    return;
  }
  try {
    const res = await fetch(API + "?" + authQuery({ builders: q }));
    const list = (await res.json()).builders || [];
    hits.hidden = false;
    hits.innerHTML = list.length
      ? list.map((c) =>
        '<div data-client="' + esc(c.id) + '" data-name="' + esc(c.name) + '">' + esc(c.name) +
        (c.short_name ? '<div class="sub2">' + esc(c.short_name) + "</div>" : "") + "</div>"
      ).join("")
      : '<div class="sub2" style="padding:7px 9px">No builder by that name \u2014 use "This builder is new".</div>';
    for (const el of hits.querySelectorAll("div[data-client]")) {
      el.onclick = () => pickBuilder(el.dataset.client, el.dataset.name);
    }
  } catch (_) {
    hits.hidden = true;
  }
}

async function pickBuilder(clientId, name) {
  stashSite();
  sheet.clientId = clientId;
  sheet.clientName = name;
  sheet.supervisorId = null;
  sheet.supervisors = [];
  renderSiteBlock();
  try {
    const res = await fetch(API + "?" + authQuery({ supervisors: clientId }));
    sheet.supervisors = (await res.json()).supervisors || [];
    renderSiteBlock();
  } catch (_) { /* the picker still works with none listed */ }
}

async function addBuilder(name) {
  const prob = document.getElementById("prob");
  stashSite();
  const res = await post({ action: "createBuilder", name });
  if (res.body.problem) {
    if (prob) prob.textContent = res.body.problem;
    return;
  }
  pickBuilder(res.body.clientId, res.body.name);
}

async function addSupervisor(name) {
  const prob = document.getElementById("prob");
  stashSite();
  const res = await post({ action: "createSupervisor", clientId: sheet.clientId, name });
  if (res.body.problem) {
    if (prob) prob.textContent = res.body.problem;
    return;
  }
  // Reused on a name match rather than duplicated, so this is safe to press twice.
  if (!(sheet.supervisors || []).some((v) => v.id === res.body.supervisorId)) {
    sheet.supervisors = (sheet.supervisors || []).concat([{
      id: res.body.supervisorId,
      name: res.body.name,
    }]);
  }
  sheet.supervisorId = res.body.supervisorId;
  sheet.addingSupervisor = false;
  sheet.newSupervisorName = "";
  renderSiteBlock();
}

function renderSiteBlock() {
  const b = document.getElementById("siteBlock");
  if (!b) return;

  if (sheet.jobId) {
    b.innerHTML = "<label>Site</label>" +
      '<div class="results"><div class="on">' + esc(sheet.siteLabel) + "</div></div>" +
      '<button class="linkish" id="changeSite">Choose a different site</button>';
    document.getElementById("changeSite").onclick = () => {
      sheet.jobId = null;
      sheet.newSite = false;
      renderSiteBlock();
    };
    return;
  }

  if (sheet.newSite) {
    // The builder is PICKED from the 154 already on file, not typed. A free-text
    // name never joins `clients`, so the site loses its link to the builder and
    // to the supervisor paired with them — and the same builder ends up in the
    // book three times with three spellings.
    const builderBlock = sheet.clientId
      ? "<label>Builder</label>" +
        '<div class="results"><div class="on">' + esc(sheet.clientName) + "</div></div>" +
        '<button class="linkish" id="changeBuilder">Choose a different builder</button>' +
        supervisorBlock()
      : '<label for="bq">Builder</label>' +
        '<input id="bq" placeholder="Start typing the builder" autocomplete="off" value="' +
        esc(sheet.builderQuery || "") + '">' +
        '<div class="results" id="bhits" hidden></div>' +
        '<button class="linkish" id="newBuilder">This builder is new</button>';

    b.innerHTML = builderBlock +
      '<label for="ad">Address</label><input id="ad" placeholder="5 Savona Way, Manor Lakes" value="' +
      esc(sheet.address || "") + '">' +
      '<label for="lt">Lot number \u2014 optional</label><input id="lt" placeholder="20410" value="' +
      esc(sheet.lot || "") + '">' +
      '<button class="linkish" id="findInstead">Find an existing site instead</button>';

    document.getElementById("findInstead").onclick = () => {
      stashSite();
      sheet.newSite = false;
      renderSiteBlock();
    };
    wireSiteFields();
    return;
  }

  b.innerHTML =
    '<label for="q">Site</label><input id="q" placeholder="Start typing an address or builder" autocomplete="off">' +
    '<div class="results" id="hits" hidden></div>' +
    '<button class="linkish" id="newSite">This is a new site</button>';
  document.getElementById("newSite").onclick = () => {
    sheet.newSite = true;
    renderSiteBlock();
  };
  document.getElementById("q").oninput = (ev) => {
    clearTimeout(findTimer);
    const v = ev.target.value;
    findTimer = setTimeout(() => searchSites(v), 220);
  };
}

async function searchSites(q) {
  const hits = document.getElementById("hits");
  if (!hits) return;
  if (q.trim().length < 2) {
    hits.hidden = true;
    return;
  }
  try {
    const res = await fetch(API + "?" + authQuery({ find: q }));
    const body = await res.json();
    const sites = body.sites || [];
    if (!sites.length) {
      hits.hidden = false;
      hits.innerHTML =
        '<div class="sub2" style="padding:7px 9px">Nothing matched \u2014 add it as a new site.</div>';
      return;
    }
    hits.hidden = false;
    hits.innerHTML = sites.map((st) => {
      const lot = st.lot_number ? "/" + esc(st.lot_number) : "";
      return '<div data-job="' + esc(st.id) + '" data-label="' +
        esc(st.client + lot + " " + st.address) + '">' +
        esc(st.client) + lot + '<div class="sub2">' + esc(st.address) + "</div></div>";
    }).join("");
    for (const el of hits.querySelectorAll("div[data-job]")) {
      el.onclick = () => {
        sheet.jobId = el.dataset.job;
        sheet.siteLabel = el.dataset.label;
        renderSiteBlock();
      };
    }
  } catch (_) {
    hits.hidden = true;
  }
}

async function post(body) {
  const res = await fetch(API + "?" + authQuery(), {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  return { ok: res.ok, body: await res.json() };
}

async function saveSheet() {
  const btn = document.getElementById("save");
  const prob = document.getElementById("prob");
  btn.disabled = true;
  prob.textContent = "";
  try {
    let jobId = sheet.jobId;

    // A new site is created first, then booked. If the site lands and the
    // booking does not, the site is still worth keeping — it is a real address.
    if (!jobId) {
      if (!sheet.newSite) {
        prob.textContent = "Pick a site, or add a new one.";
        return;
      }
      stashSite();
      if (!sheet.clientId) {
        prob.textContent = "Pick the builder, or add them if they are new.";
        return;
      }
      const made = await post({
        action: "createSite",
        client: sheet.clientName,
        clientId: sheet.clientId,
        supervisorId: sheet.supervisorId,
        address: sheet.address,
        lot: sheet.lot,
      });
      if (made.body.problem) {
        prob.textContent = made.body.problem;
        return;
      }
      jobId = made.body.jobId;
    }

    // From a tapped square the day and the person are already decided; from the
    // button at the top they are fields, and "Unallocated for now" is a real
    // answer rather than a missing one.
    const day = sheet.free ? document.getElementById("dy").value : sheet.cell.day;
    const resourceId = sheet.free
      ? (document.getElementById("who").value || null)
      : sheet.cell.resourceId;
    if (!day) { prob.textContent = "Pick a day."; return; }

    const made = await post({
      action: "createBooking",
      jobId,
      workType: document.getElementById("wt").value,
      day,
      startTime: document.getElementById("tm").value,
      resourceId,
    });
    if (made.body.problem) {
      prob.textContent = made.body.problem;
      return;
    }
    const g = made.body.grid;
    closeSheet();
    if (g) render(g);
  } catch (_) {
    prob.textContent = "Could not save that. Check your signal.";
  } finally {
    if (document.getElementById("save")) btn.disabled = false;
  }
}

// ── drag (desktop) ────────────────────────────────────────────────────────

let dragging = null;

document.addEventListener("dragstart", (ev) => {
  const card = ev.target.closest && ev.target.closest(".card");
  if (!card) return;
  dragging = { bookingId: card.dataset.booking, from: cellOf(card.closest("td")) };
  card.classList.add("dragging");
  ev.dataTransfer.effectAllowed = "move";
  // Firefox refuses to start a drag unless something is set.
  ev.dataTransfer.setData("text/plain", card.dataset.booking);
});

document.addEventListener("dragend", () => {
  dragging = null;
  for (const el of document.querySelectorAll(".dragging")) el.classList.remove("dragging");
  for (const el of document.querySelectorAll(".target")) el.classList.remove("target");
});

document.addEventListener("dragover", (ev) => {
  if (!dragging) return;
  const td = ev.target.closest && ev.target.closest("td[data-day]");
  if (!td) return;
  ev.preventDefault();
  for (const el of document.querySelectorAll(".target")) el.classList.remove("target");
  td.classList.add("target");
});

document.addEventListener("drop", (ev) => {
  if (!dragging) return;
  const td = ev.target.closest && ev.target.closest("td[data-day]");
  if (!td) return;
  ev.preventDefault();
  const { bookingId, from } = dragging;
  dragging = null;
  move(bookingId, from, cellOf(td));
});

// ── tap, then tap (touch) ─────────────────────────────────────────────────
//
// HTML5 drag and drop does not fire on touch at all, and this board gets opened
// on a phone. Same fallback report-edit uses for moving a photo.

document.addEventListener("click", (ev) => {
  // The crew button comes first: it sits inside a card, and tapping it must not
  // also pick the card up for a move.
  const more = ev.target.closest && ev.target.closest("[data-more]");
  if (more) {
    ev.stopPropagation();
    picked = null;
    openCrewSheet(more.dataset.more);
    return;
  }

  const card = ev.target.closest && ev.target.closest(".card");
  if (card) {
    const cell = cellOf(card.closest("td"));
    if (
      picked && picked.bookingId === card.dataset.booking &&
      picked.resourceId === cell.resourceId && picked.day === cell.day
    ) {
      picked = null; // tapping it again puts it back down
    } else {
      picked = Object.assign({ bookingId: card.dataset.booking }, cell);
    }
    render(grid);
    return;
  }

  const td = ev.target.closest && ev.target.closest("td[data-day]");
  if (!td) return;
  if (picked) {
    const from = { resourceId: picked.resourceId, day: picked.day };
    const bookingId = picked.bookingId;
    picked = null;
    move(bookingId, from, cellOf(td));
    return;
  }
  // Nothing in hand, so an empty square is an invitation to add work there.
  // No per-cell button: 29 rows across 21 days is 609 of them.
  if (!loading && !crewSheet && !sheet) openSheet(cellOf(td));
});

document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape") return;
  if (crewSheet) closeCrewSheet();
  else if (sheet) closeSheet();
  else if (picked) {
    picked = null;
    render(grid);
  }
});

document.getElementById("prev").onclick = () => {
  offset--;
  load();
};
document.getElementById("next").onclick = () => {
  offset++;
  load();
};
document.getElementById("now").onclick = () => {
  offset = 0;
  load();
};
document.getElementById("add").onclick = () => {
  if (!loading && !crewSheet && !sheet) openSheet(null);
};
load();
</script>
